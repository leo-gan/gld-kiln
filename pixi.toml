[workspace]
name = "mojo-kiln"
version = "0.3.0"
description = "Positional little-endian serializer for Mojo"
authors = ["Leonid Ganeline"]
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
mojo = "==1.1.0"

[feature.oracle.dependencies]
python = ">=3.11"

[feature.bench.tasks]
microbench = "bash scripts/run-microbench.sh"
experiments = "bash scripts/run-experiments.sh"

[environments]
default = { features = [] }
oracle = ["oracle"]
bench = ["bench"]

[tasks]
test = "bash scripts/run-tests.sh"
generate = "bash scripts/generate.sh"
precompile = "bash scripts/precompile.sh"
check-generated = "bash scripts/check-generated.sh"
golden = "python3 spec/reference/gen_golden.py"
