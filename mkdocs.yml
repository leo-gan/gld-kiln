site_name: mojo-kiln
site_description: Positional little-endian serializer for Mojo
site_author: Leonid Ganeline
site_url: https://leo-gan.github.io/gld-kiln/
repo_url: https://github.com/leo-gan/gld-kiln
repo_name: leo-gan/gld-kiln
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Leonid Ganeline. MIT.

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  icon:
    logo: material/code-braces
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/leo-gan/gld-kiln
      name: GitHub Repository

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

exclude_docs: |
  internal/**

nav:
  - Home: index.md
  - Why Kiln: why-kiln.md
  - Instructions: instructions.md
  - Examples: examples.md
  - Techniques: techniques.md
  - Test data: test-data.md
  - Spec:
    - Contents: spec/index.md
    - Introduction: spec/first.md
    - Glossary: spec/glossary.md
    - Terminology: spec/terminology.md
    - Introduction:
      - The same record in three encodings: spec/record.md
      - Schema and declaration order: spec/schema.md
      - Widths, lengths, and byte order: spec/widths.md
      - Lists and a count that must fit: spec/lists.md
      - A batch of records: spec/batch.md
      - A numeric array: spec/array.md
      - Names, scales, and foreign blocks: spec/directory-intro.md
      - The frame: spec/frame-intro.md
      - What this version leaves out: spec/omitted.md
    - Rules:
      - Frozen values: spec/frozen.md
      - Lengths and allocation: spec/lengths.md
      - Byte order: spec/byte-order.md
      - Schema hash: spec/schema-hash.md
      - Frame: spec/frame.md
      - Tensor directory: spec/tensor-directory.md
      - Check order: spec/check-order.md
      - Dtypes: spec/dtypes.md
      - Quantization: spec/quantization.md
      - Opaque layouts: spec/opaque.md
      - Canonical layout: spec/canonical.md
      - Embedding: spec/embedding.md
      - Errors: spec/errors.md
      - Golden cases: spec/golden.md
      - Dynamic values: spec/dynamic.md
      - The trusted reader: spec/trusted.md
      - Profiles: spec/profiles.md
      - Changes from the previous draft: spec/changes.md
  - Experiments: experiments.md
