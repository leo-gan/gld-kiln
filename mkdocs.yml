site_name: Kiln
site_description: Positional little-endian wire format and tensor directory specification (with the Mojo reference implementation)
site_author: Leonid Ganeline
site_url: https://leo-gan.github.io/gld-kiln/
repo_url: https://github.com/leo-gan/gld-kiln
repo_name: leo-gan/gld-kiln
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Leonid Ganeline. MIT.

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  icon:
    logo: material/code-braces
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/leo-gan/gld-kiln
      name: GitHub Repository

plugins:
  - search

markdown_extensions:
  - attr_list
  - footnotes
  - md_in_html
  - admonition
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 3

exclude_docs: |
  internal/**

nav:
  - Home: index.md
  - Overview & Comparison: comparison.md
  - Wire Specification (v2): spec/index.md
  - Mojo Implementation:
    - Quickstart & Examples: mojo/quickstart.md
    - API Reference: mojo/api.md
    - Implementation & Verification: mojo/internals.md
  - Experiments: experiments.md
