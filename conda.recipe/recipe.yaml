# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: "0.1.0"

package:
  name: mojo-kiln
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  script:
    - mkdir -p ${{ PREFIX }}/lib/mojo ${{ PREFIX }}/bin
    - mojo precompile -I src src/kiln -o ${{ PREFIX }}/lib/mojo/kiln.mojoc
    - mojo build -I src src/codegen/cli.mojo -o ${{ PREFIX }}/bin/gld-kilngen-mojo

requirements:
  build:
    - mojo-compiler ==1.1.0
  host:
    - mojo-compiler ==1.1.0
  run:
    - ${{ pin_compatible('mojo-compiler') }}

tests:
  - script:
      - if: unix
        then:
          - mojo run test_import.mojo
          - gld-kilngen-mojo --help
    files:
      recipe:
        - test_import.mojo

about:
  homepage: https://leo-gan.github.io/gld-kiln/
  repository: https://github.com/leo-gan/gld-kiln
  documentation: https://leo-gan.github.io/gld-kiln/
  license: MIT
  license_file: LICENSE
  summary: Positional little-endian serializer for Mojo
  description: |
    Runtime and code generator written in Mojo. Does not wrap a C, C++, or
    Rust serializer. The package installs kiln.mojoc and the gld-kilngen-mojo CLI.
